[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Bathynomus"
version = "0.0.1"
dependencies = [
  "Django>=6.1",
]
requires-python = ">=3.15"
authors = [
  {name = "Luke Christopher Clarke", email = "luke@nearbeach.org"},
]
maintainers = [
  {name = "Luke Christopher Clarke", email = "luke@nearbeach.org"},
]
description = "Bathynomus - An open source quality assurance software"
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
  "quality assurance",
  "open source"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "black",
  "bandit",
  "python-dotenv",
]

[project.urls]
Homepage = "https://nearbeach.org"
Documentation = "https://bathynomus.readthedocs.io/en/latest/"
Repository = "https://github.com/NearBeach/Bathynomus.git"

[project.scripts]
"manage.py" = "myproject:django_manage"

[tool.django-stubs]
django_settings_module = "local.settings"

[tool.setuptools]
packages = ["Bathynomus"]